<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#3A2F28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rivaldo">
  <title>Dashboard — Painel Rivaldo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="is-booting">
  <a class="skip-link" href="#content">Pular para o conteúdo</a>

  <!-- Exibida enquanto a sessão é confirmada no servidor -->
  <div class="boot" aria-live="polite">
    <img class="brand-logo brand-logo--boot" src="../assets/images/logo-assinatura.webp" alt="" width="931" height="140" decoding="async">
    <span class="sr-only">Carregando painel…</span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" id="content" tabindex="-1">
        <div class="page-head">
          <div>
            <p class="eyebrow" id="today"></p>
            <h1 class="page-title" id="greeting">Dashboard</h1>
          </div>
          <a class="btn btn--gold" href="imovel-form.html">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
            <span>Adicionar imóvel</span>
          </a>
        </div>

        <section aria-label="Resumo dos imóveis">
          <div class="stats" id="stats" aria-busy="true"></div>
        </section>

        <section class="card" aria-labelledby="recentTitle">
          <div class="card__head">
            <h2 class="card__title" id="recentTitle">Imóveis recentes</h2>
            <a class="btn btn--ghost btn--sm" href="imoveis.html">
              Ver todos
              <svg class="icon" aria-hidden="true"><use href="#i-arrowRight"/></svg>
            </a>
          </div>
          <div id="recent" aria-busy="true"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
