<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#3A2F28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rivaldo">
  <title>Sem conexão — Painel Rivaldo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <main class="offline">
    <div class="auth__card" style="text-align:center">
      <img class="brand-logo brand-logo--auth" style="margin:0 auto 1.75rem" src="../assets/images/logo-assinatura.webp" alt="" width="931" height="140" decoding="async">
      <h1 class="auth__title" style="margin-bottom:.5rem">Você está sem internet</h1>
      <p class="muted">O painel precisa de conexão para mostrar e salvar os dados dos imóveis. Assim que a internet voltar, é só tentar de novo.</p>
      <button class="btn btn--gold btn--block" type="button" style="margin-top:1.5rem" onclick="location.reload()">Tentar novamente</button>
    </div>
  </main>
</body>
</html>
