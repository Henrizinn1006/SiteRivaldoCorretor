<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#3A2F28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rivaldo">
  <title>Meu perfil — Painel Rivaldo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="is-booting">
  <a class="skip-link" href="#content">Pular para o conteúdo</a>

  <!-- Exibida enquanto a sessão é confirmada no servidor -->
  <div class="boot" aria-live="polite">
    <img class="brand-logo brand-logo--boot" src="../assets/images/logo-assinatura.webp" alt="" width="931" height="140" decoding="async">
    <span class="sr-only">Carregando painel…</span>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" id="content" tabindex="-1">
        <div class="page-head">
          <div>
            <h1 class="page-title">Meu perfil</h1>
            <p class="page-subtitle">Perfil de acesso: <b id="roleInfo"></b></p>
          </div>
        </div>

        <div class="two-col">
          <form class="card" id="profileForm" novalidate aria-labelledby="pf-title">
            <div class="card__head"><h2 class="card__title" id="pf-title">Dados pessoais</h2></div>
            <div class="card__body">
              <div class="form-field">
                <label for="p-name">Nome</label>
                <input class="input" id="p-name" name="name" maxlength="120" required autocomplete="name">
              </div>
              <div class="form-field">
                <label for="p-username">Usuário de acesso</label>
                <input class="input" id="p-username" type="text" readonly aria-readonly="true" tabindex="-1">
                <p class="form-hint">Só o provedor (Vortexis) altera o nome de usuário.</p>
              </div>
              <div class="form-field">
                <label for="p-email">E-mail <span class="subtle">(opcional — também serve para entrar)</span></label>
                <input class="input" id="p-email" name="email" type="email" inputmode="email" autocapitalize="none" maxlength="190" autocomplete="email">
              </div>
              <div class="form-field" id="emailConfirm" hidden>
                <label for="p-current">Senha atual</label>
                <input class="input" id="p-current" name="current_password" type="password" autocomplete="current-password" maxlength="200">
                <p class="form-hint">Por segurança, confirme sua senha para trocar o e-mail.</p>
              </div>
            </div>
            <div class="card__foot"><button class="btn btn--gold" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span>Salvar dados</span></button></div>
          </form>

          <form class="card" id="passwordForm" novalidate aria-labelledby="pw-title">
            <div class="card__head"><h2 class="card__title" id="pw-title">Alterar senha</h2></div>
            <div class="card__body">
              <div class="notice" id="pwStatus" hidden></div>
              <input type="text" name="username" autocomplete="username" hidden>
              <fieldset id="pwFields">
              <div class="form-field">
                <label for="pw-current">Senha atual</label>
                <input class="input" id="pw-current" name="current_password" type="password" autocomplete="current-password" maxlength="200" required>
              </div>
              <div class="form-field">
                <label for="pw-new">Nova senha</label>
                <input class="input" id="pw-new" name="password" type="password" autocomplete="new-password" maxlength="200" required>
                <p class="form-hint">Mínimo de 10 caracteres, com letras e números.</p>
              </div>
              <div class="form-field">
                <label for="pw-confirm">Confirmar nova senha</label>
                <input class="input" id="pw-confirm" name="password_confirmation" type="password" autocomplete="new-password" maxlength="200" required>
              </div>
              </fieldset>
            </div>
            <div class="card__foot"><button class="btn btn--gold" type="submit" id="pwSubmit"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><span>Alterar senha</span></button></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
